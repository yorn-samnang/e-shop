services:
  web-ecommerce-prod:
    profiles: [prod]
    image: csbproj/ecommerce:v0.0.0
    build:
      context: Ecommerce
      dockerfile: dockerfile
    env_file: Ecommerce/.env
    environment:
      PORT: ${ECOMMERCE_PORT:-3001}
    depends_on:
      - db
      - backend
    ports:
      - "${ECOMMERCE_PORT:-3001}:3001"
    develop:
      watch:
        - action: sync
          path: Ecommerce
          target: /app
          ignore:
            - node_modules
        - action: rebuild
          path: package.json

  web-admin-prod:
    profiles: [prod]
    restart: unless-stopped
    image: csbproj/frontend:v0.0.0
    build:
      context: AdminDashboard
      dockerfile: dockerfile
    env_file: AdminDashboard/.env
    environment:
      PORT: ${ADMIN_PORT:-3000}
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      - db
      - backend
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    develop:
      watch:
        - action: sync
          path: AdminDashboard
          target: /app
        - action: rebuild
          path: package.json

  web-ecommerce-dev:
    profiles: [dev]
    image: csbproj/ecommerce:v0.0.0
    build:
      context: Ecommerce
      dockerfile: dockerfile.dev
    env_file: Ecommerce/.env
    environment:
      PORT: ${ECOMMERCE_PORT:-3001}
    depends_on:
      - db
      - backend
    ports:
      - "${ECOMMERCE_PORT:-3001}:3001"
    develop:
      watch:
        - action: sync
          path: Ecommerce
          target: /app
          ignore:
            - node_modules
        - action: rebuild
          path: package.json

  web-admin-dev:
    profiles: [dev]
    restart: unless-stopped
    image: csbproj/frontend:v0.0.0
    build:
      context: AdminDashboard
      dockerfile: dockerfile.dev
    env_file: AdminDashboard/.env
    environment:
      PORT: ${ADMIN_PORT:-3000}
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      - db
      - backend
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    develop:
      watch:
        - action: sync
          path: AdminDashboard
          target: /app
        - action: rebuild
          path: package.json

  # Your backend service (modify the existing web service or add a new one)
  backend:
    profiles: [prod, dev]
    build: Backend
    image: csbproj/backend:v0.0.0
    command: >
      bash -c "python manage.py migrate &&
               python manage.py collectstatic --noinput &&
               gunicorn ecommerce_project.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - Backend/.env
    develop:
      watch:
        - action: sync
          path: Backend
          target: /app

  # Existing database service
  db:
    profiles: [prod, dev]
    image: postgres:14
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - Backend/.env
    ports:
      - "5432:5432"

volumes:
  postgres_data:
  static_volume:
  media_volume:
